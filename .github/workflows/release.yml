name: Release

# Builds every supported, actually-usable platform and attaches them to a
# GitHub Release. Wails can't cross-compile between OSes, so each OS builds on
# its own runner. Linux is intentionally omitted: the secret store (API keys)
# has no Linux implementation, so a Linux build would launch but can't be used.
#
#   - macOS universal .dmg (Intel + Apple Silicon in one)  — macos-latest
#   - Windows amd64 / 386 / arm64 portable .zip            — windows-latest matrix
#
# Triggers:
#   - pushing a tag like v0.2.0 -> builds all and uploads to that tag's release
#   - manual run with a tag input -> backfill builds onto an existing release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # upload release assets

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build app (darwin/universal)
        run: wails build -platform darwin/universal -clean
      - name: Package .dmg
        # make-dmg.sh builds axon-mcp into the bundle, re-signs ad-hoc, and
        # produces build/bin/Axon-x-<version>.dmg (works for the universal app).
        run: bash scripts/make-dmg.sh
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: build/bin/*.dmg

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, 386, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build app (windows/${{ matrix.arch }})
        run: wails build -platform windows/${{ matrix.arch }} -clean
      - name: Build axon-mcp (${{ matrix.arch }}) next to the app
        # Ship axon-mcp.exe beside Axon-x.exe so one-click MCP install finds it
        # via os.Executable(). Pure-Go sqlite means no cgo, so GOARCH is enough.
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: go build -o build/bin/axon-mcp.exe ./cmd/axon-mcp
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "build/bin/Axon-x-$tag-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path build/bin/Axon-x.exe, build/bin/axon-mcp.exe -DestinationPath $zip -Force
          echo "ASSET=$zip" >> $env:GITHUB_ENV
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.ASSET }}
