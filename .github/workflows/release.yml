name: Release

# Builds both platforms and attaches them to a GitHub Release:
#   - macOS (Apple Silicon / arm64) .dmg   — built on a macos-latest (arm64) runner
#   - Windows (amd64) portable .zip         — built on windows-latest
# Wails can't cross-compile, so each platform builds on its own runner.
#
# Triggers:
#   - pushing a tag like v0.2.0 -> builds both and uploads to that tag's release
#   - manual run with a tag input -> backfill builds onto an existing release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # upload release assets

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build app (darwin/arm64)
        run: wails build -clean
      - name: Package .dmg
        # make-dmg.sh builds axon-mcp into the bundle, re-signs ad-hoc, and
        # produces build/bin/Axon-x-<version>.dmg.
        run: bash scripts/make-dmg.sh
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: build/bin/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build app (windows/amd64)
        run: wails build -platform windows/amd64 -clean
      - name: Build axon-mcp next to the app
        # One-click "接入 Claude Code" locates axon-mcp.exe via os.Executable(),
        # i.e. beside the main .exe — ship them together.
        run: go build -o build/bin/axon-mcp.exe ./cmd/axon-mcp
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "build/bin/Axon-x-$tag-windows-amd64.zip"
          Compress-Archive -Path build/bin/Axon-x.exe, build/bin/axon-mcp.exe -DestinationPath $zip -Force
          echo "ASSET=$zip" >> $env:GITHUB_ENV
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.ASSET }}
