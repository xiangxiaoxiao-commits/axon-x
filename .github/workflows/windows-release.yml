name: Windows Release

# Builds the Windows (amd64) portable app and attaches it to a GitHub Release.
# Cross-compiling a Wails app from macOS isn't supported (WebView2 bindings +
# NSIS must run on Windows), so this runs on a Windows runner instead.
#
# Triggers:
#   - pushing a tag like v0.1.1  -> builds and uploads to that tag's release
#   - manual run (workflow_dispatch) with a tag input -> lets you attach a
#     Windows build to an already-published release (e.g. v0.1.0)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Windows build to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # needed to upload release assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build app (windows/amd64)
        run: wails build -platform windows/amd64 -clean

      - name: Build axon-mcp next to the app
        # The one-click "接入 Claude Code" locates axon-mcp.exe via os.Executable(),
        # i.e. right beside the main .exe — so ship them together.
        run: go build -o build/bin/axon-mcp.exe ./cmd/axon-mcp

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "build/bin/Axon-x-$tag-windows-amd64.zip"
          Compress-Archive -Path build/bin/Axon-x.exe, build/bin/axon-mcp.exe -DestinationPath $zip -Force
          echo "ASSET=$zip" >> $env:GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.ASSET }}
